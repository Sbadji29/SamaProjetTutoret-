<div class="auth-wrapper d-flex align-items-center justify-content-center min-vh-100 py-5 bg-light">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

        <div class="card border-0 shadow-sm rounded-4 p-4">
          <div class="card-body">

            <!-- Logo & En-tête -->
            <div class="text-center mb-4">
              <div class="logo-box d-inline-flex align-items-center justify-content-center text-white rounded-3 mb-2">
                <i class="bi bi-mortarboard-fill fs-4"></i>
              </div>
              <h4 class="fw-bold text-dark mb-1">Connexion</h4>
              <p class="text-muted small">Accédez à votre espace UniProjet</p>
            </div>

            <!-- Formulaire -->
            <form>
              <!-- Champ Email -->
              <div class="mb-3">
                <label for="loginEmail" class="form-label small fw-semibold text-secondary">Adresse email</label>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0 text-muted">
                    <i class="bi bi-envelope"></i>
                  </span>
                  <input type="email" class="form-control border-start-0 ps-0" id="loginEmail" placeholder="nom@exemple.com" required>
                </div>
              </div>

              <!-- Champ Mot de passe -->
              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                  <label for="loginPassword" class="form-label small fw-semibold text-secondary">Mot de passe</label>
                </div>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0 text-muted">
                    <i class="bi bi-lock"></i>
                  </span>
                  <input type="password" class="form-control border-start-0 ps-0" id="loginPassword" placeholder="••••••••" required>
                </div>
                <div class="text-end">
                  <a href="#" class="small text-decoration-none custom-link">Mot de passe oublié ?</a>
                </div>
              </div>

              <!-- Bouton de soumission -->
              <button type="submit" class="btn btn-custom-green w-100 py-2 fw-semibold rounded-3 mb-3">
                Se connecter
              </button>
            </form>

            <!-- Lien vers Inscription -->
            <div class="text-center">
              <span class="small text-muted">Pas encore de compte ? </span>
              <a href="#" class="small fw-semibold text-decoration-none custom-link">Créer un compte</a>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>
</div>
