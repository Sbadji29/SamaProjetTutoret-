
<div class="responsable-layout">

  <aside class="sidebar">
    <a routerLink="/responsable/dashboard" class="brand">
      <span class="brand-icon">
        <i class="bi bi-mortarboard-fill"></i>
      </span>
      <span>
        <strong>UniProjet</strong>
        <small>Responsable pédagogique</small>
      </span>
    </a>

    <div class="menu-label">MENU PRINCIPAL</div>

    <nav class="sidebar-nav">
      <a
        routerLink="/responsable/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <i class="bi bi-grid-1x2-fill"></i>
        <span>Tableau de bord</span>
      </a>

      <a
        routerLink="/responsable/traitement-candidatures"
        routerLinkActive="active"
      >
        <i class="bi bi-clipboard-check"></i>
        <span>Traitement des candidatures</span>
      </a>

      <a
        routerLink="/responsable/affectations"
        routerLinkActive="active"
      >
        <i class="bi bi-people-fill"></i>
        <span>Affectations</span>
      </a>

      <a
        routerLink="/responsable/capacites"
        routerLinkActive="active"
      >
        <i class="bi bi-bar-chart-fill"></i>
        <span>Capacités d'encadrement</span>
      </a>

      <a
        routerLink="/responsable/rapports"
        routerLinkActive="active"
      >
        <i class="bi bi-file-earmark-bar-graph"></i>
        <span>Rapports</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <i class="bi bi-shield-check"></i>
      <span>Gestion des projets tutorés</span>
    </div>
  </aside>

  <main class="main-area">
    <header class="topbar">
      <div>
        <span class="topbar-label">UniProjet / Administration</span>
        <h1>Espace Responsable pédagogique</h1>
      </div>

      <div class="profile">
        <div class="profile-avatar">RP</div>
        <div class="profile-info">
          <strong>Responsable pédagogique</strong>
          <span>Gestion académique</span>
        </div>
      </div>
    </header>

    <section class="page-content">
      <router-outlet></router-outlet>
    </section>
  </main>

</div>
