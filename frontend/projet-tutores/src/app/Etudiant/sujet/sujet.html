<div class="card subject-card border-0 shadow-sm rounded-4 p-3 h-100">
  <div class="card-body d-flex flex-column p-0">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <span class="badge-status d-flex align-items-center gap-2 fw-semibold">
        <span class="status-dot"></span>
        {{ data?.statut || 'Disponible' }}
      </span>
      <span class="text-muted small d-flex align-items-center gap-1 date-badge">
        <i class="bi bi-calendar3"></i>
        {{ data?.date || '10 Oct 2024' }}
      </span>
    </div>

    <div *ngIf="data?.reference" class="badge bg-light text-muted border align-self-start mb-2" style="font-size: 0.7rem;">
      {{ data?.reference }}
    </div>

    <h5 class="card-title fw-bold project-title mb-2">
      {{ data?.titre }}
    </h5>

    <p class="card-text text-secondary small mb-3 lh-base project-desc flex-grow-1">
      {{ data?.description }}
    </p>

    <div class="small mb-3">
      <span class="fw-bold text-dark">{{ data?.encadrant }}</span>
      <span *ngIf="data?.laboratoire" class="text-muted mx-1">•</span>
      <span *ngIf="data?.laboratoire" class="text-secondary">{{ data?.laboratoire }}</span>
    </div>

    <hr class="my-0 mb-3 border-secondary-subtle opacity-50">

    <div class="d-flex align-items-center justify-content-between mt-auto">
      <div>
        <div class="text-secondary capacity-label">Capacité</div>
        <div class="fw-bold text-dark small">
          {{ data ? (data.placesOccupees + ' / ' + data.placesTotales + ' places') : '1 / 3 places' }}
        </div>
      </div>

      <button
        type="button"
        (click)="onSelect()"
        class="btn btn-detail d-inline-flex align-items-center gap-2 px-3 py-2 rounded-3 fw-semibold border-0">
        Candidater
        <i class="bi bi-arrow-right"></i>
      </button>
    </div>
  </div>
</div>
