<div class="auth-wrapper d-flex align-items-center justify-content-center min-vh-100 py-5 bg-light">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

        <div class="card border-0 shadow-sm rounded-4 p-4">
          <div class="card-body">

            <div class="text-center mb-4">
              <div class="logo-box d-inline-flex align-items-center justify-content-center text-white rounded-3 mb-2">
                <i class="bi bi-mortarboard-fill fs-4"></i>
              </div>
              <h4 class="fw-bold text-dark mb-1">Créer un compte</h4>
              <p class="text-muted small">Rejoignez le portail universitaire UniProjet</p>
            </div>

            <div *ngIf="erreur" class="alert alert-danger py-2 px-3 small border-0 rounded-3 mb-3" role="alert">
              <i class="bi bi-exclamation-circle-fill me-1"></i>
              {{ erreur }}
            </div>

            <div *ngIf="succes" class="alert alert-success py-2 px-3 small border-0 rounded-3 mb-3" role="alert">
              <i class="bi bi-check-circle-fill me-1"></i>
              {{ succes }}
            </div>

            <form (ngSubmit)="onSubmit()">
              <div class="mb-3">
                <label for="registerName" class="form-label small fw-semibold text-secondary">Nom complet</label>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0 text-muted">
                    <i class="bi bi-person"></i>
                  </span>
                  <input
                    type="text"
                    class="form-control border-start-0 ps-0"
                    id="registerName"
                    name="nomComplet"
                    [(ngModel)]="nomComplet"
                    placeholder="ex. Alioune Badara Badji"
                    required>
                </div>
              </div>

              <div class="mb-3">
                <label for="registerEmail" class="form-label small fw-semibold text-secondary">Adresse email</label>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0 text-muted">
                    <i class="bi bi-envelope"></i>
                  </span>
                  <input
                    type="email"
                    class="form-control border-start-0 ps-0"
                    id="registerEmail"
                    name="email"
                    [(ngModel)]="email"
                    placeholder="badji.alioune-badara@ugb.edu.sn"
                    required>
                </div>
              </div>

              <div class="mb-3">
                <label for="registerRole" class="form-label small fw-semibold text-secondary">Statut universitaire</label>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0 text-muted">
                    <i class="bi bi-briefcase"></i>
                  </span>
                  <select
                    class="form-select border-start-0 ps-0 text-secondary"
                    id="registerRole"
                    name="roleChoisi"
                    [(ngModel)]="roleChoisi"
                    required>
                    <option value="" disabled>Sélectionnez votre rôle</option>
                    <option value="ETUDIANT">Étudiant</option>
                    <option value="ENSEIGNANT">Enseignant / Tuteur</option>
                    <option value="RESPONSABLE">Responsable pédagogique</option>
                  </select>
                </div>
              </div>

              <div class="row g-2 mb-3">
                <div class="col-md-6">
                  <label for="registerPassword" class="form-label small fw-semibold text-secondary">Mot de passe</label>
                  <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted">
                      <i class="bi bi-lock"></i>
                    </span>
                    <input
                      type="password"
                      class="form-control border-start-0 ps-0"
                      id="registerPassword"
                      name="motDePasse"
                      [(ngModel)]="motDePasse"
                      placeholder="••••••••"
                      required>
                  </div>
                </div>
                <div class="col-md-6">
                  <label for="registerConfirmPassword" class="form-label small fw-semibold text-secondary">Confirmation</label>
                  <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted">
                      <i class="bi bi-shield-check"></i>
                    </span>
                    <input
                      type="password"
                      class="form-control border-start-0 ps-0"
                      id="registerConfirmPassword"
                      name="confirmationMotDePasse"
                      [(ngModel)]="confirmationMotDePasse"
                      placeholder="••••••••"
                      required>
                  </div>
                </div>
              </div>

              <div class="form-check mb-4">
                <input
                  class="form-check-input custom-checkbox"
                  type="checkbox"
                  id="terms"
                  name="accepteConditions"
                  [(ngModel)]="accepteConditions"
                  required>
                <label class="form-check-label small text-muted" for="terms">
                  J'accepte les conditions générales d'utilisation
                </label>
              </div>

              <button
                type="submit"
                [disabled]="chargement"
                class="btn btn-custom-green w-100 py-2 fw-semibold rounded-3 mb-3 d-flex align-items-center justify-content-center gap-2">
                <span *ngIf="chargement" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                <span>{{ chargement ? 'Création en cours...' : 'Créer mon compte' }}</span>
              </button>
            </form>

            <div class="text-center">
              <span class="small text-muted">Vous avez déjà un compte ? </span>
              <a routerLink="/connexion" class="small fw-semibold text-decoration-none custom-link">Se connecter</a>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>
</div>
