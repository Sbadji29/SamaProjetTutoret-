<header class="d-flex align-items-center justify-content-between pb-3 mb-4 border-bottom border-light-subtle app-header">
  
  <nav aria-label="breadcrumb" class="breadcrumb-nav">
    <span class="text-muted small">{{ filiere }}</span>
    <span class="text-muted mx-2 small">/</span>
    <span class="text-muted small">{{ module }}</span>
    <span class="text-muted mx-2 small">/</span>
    <span class="session-tag fw-bold small">{{ session }}</span>
  </nav>

  
  <div class="d-flex align-items-center gap-3">
    
    <button type="button" class="btn btn-icon position-relative text-secondary p-1" aria-label="Notifications">
      <i class="bi bi-bell fs-5"></i>
      @if (hasNotification) {
        <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle">
          <span class="visually-hidden">Nouvelles notifications</span>
        </span>
      }
    </button>

    
    <div class="vr bg-secondary opacity-25" style="height: 24px;"></div>

    
    <div class="d-flex align-items-center gap-2 cursor-pointer" [title]="userName">
      <img
        [src]="userAvatar"
        [alt]="userName"
        class="rounded-circle header-avatar"
      />
      <i class="bi bi-chevron-down text-muted small"></i>
    </div>
  </div>
</header>
